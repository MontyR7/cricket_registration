{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 text-center">
            <div class="success-animation mb-4">
                <i class="fas fa-check-circle text-success" style="font-size: 5rem; animation: bounceIn 1s ease-in-out;"></i>
            </div>
            <h1 class="display-4 mb-4">Congratulations! 🎉</h1>
            <h3 class="text-success mb-4">Registration Complete!</h3>
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <p class="lead text-dark mb-0">Welcome to the Cricket Tournament!</p>
                </div>
            </div>
            <a href="/" class="btn btn-primary btn-lg">
                <i class="fas fa-home me-2"></i>Return to Home
            </a>
        </div>
    </div>
</div>

<style>
@keyframes bounceIn {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
}

.success-animation {
    animation: bounceIn 1s ease-in-out;
}
</style>
{% endblock %}
