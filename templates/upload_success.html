{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <div class="mb-4">
                        <i class="fas fa-check-circle text-success fa-4x"></i>
                    </div>
                    
                    <h2 class="card-title mb-4">Payment Proof Submitted</h2>
                    
                    <div class="alert alert-success mb-4">
                        <p class="mb-0">Your payment screenshot has been successfully uploaded.</p>
                        <p class="mb-0 mt-2">Thank you for registration!!.</p>
                    </div>
                    
                    <a href="{{ url_for('register') }}" class="btn btn-primary">Return to Registration</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
